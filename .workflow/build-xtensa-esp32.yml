version: '1.0'
name: zephyr-build-xtensa-esp32
displayName: Zephyr Docker Build (Xtensa ESP32)
triggers:
  trigger: manual
stages:
  - name: prepare
    displayName: Resolve Zephyr version
    trigger: auto
    steps:
      - step: build@python
        name: prepare_xtensa_esp32
        displayName: Prepare Xtensa ESP32 Dockerfile
        pythonVersion: '3.9'
        commands:
          - |
            set -eu
            cd "$WORKSPACE"
            python3 - <<'PY'
            import json
            import os
            from pathlib import Path
            import re
            from urllib.request import urlopen

            for name in ("REGISTRY_CERTIFICATE", "REGISTRY_HOST", "IMAGE_NAMESPACE",
                         "REGISTRY_USERNAME", "REGISTRY_PASSWORD",
                         "RELEASE_REPOSITORY", "RELEASE_TOKEN"):
                if not os.environ.get(name, "").strip():
                    raise ValueError(f"Missing pipeline parameter: {name}")
            version = os.environ.get("ZEPHYR_VERSION", "").strip()
            if not version:
                with urlopen("https://api.github.com/repos/zephyrproject-rtos/zephyr/releases/latest",
                             timeout=120) as response:
                    version = json.load(response)["tag_name"]
            if not re.fullmatch(r"v\d+\.\d+\.\d+(?:[-.][A-Za-z0-9.-]+)?", version):
                raise ValueError("ZEPHYR_VERSION must be a version tag, e.g. v4.4.2")
            path = Path("Dockerfile.xtensa-esp32")
            text, count = re.subn(r"^ARG ZEPHYR_VERSION=.*$",
                                 f"ARG ZEPHYR_VERSION={version}",
                                 path.read_text(), flags=re.MULTILINE)
            if count != 1:
                raise ValueError("Expected exactly one ZEPHYR_VERSION argument")
            path.write_text(text)
            with Path("GITEE_PARAMS").open("a") as params:
                params.write(f"RESOLVED_VERSION={version}\n")
            print(f"Building Zephyr {version}")
            PY
        artifacts:
          - name: XTENSA_DOCKERFILE
            path:
              - ./Dockerfile.xtensa-esp32
  - name: build
    displayName: Build and push intermediate image
    trigger: auto
    steps:
      - step: build@docker
        name: build_xtensa_esp32
        displayName: Build Xtensa ESP32 image
        type: cert
        certificate: ${REGISTRY_CERTIFICATE}
        tag: ${IMAGE_NAMESPACE}/zephyr-sdk-xtensa-esp32:${RESOLVED_VERSION}
        dockerfile: ./Dockerfile.xtensa-esp32
        context: ''
        artifacts:
          - ${XTENSA_DOCKERFILE}
        isCache: true
  - name: release
    displayName: Publish Gitee Release
    trigger: auto
    steps:
      - step: build@gcc
        name: release_xtensa_esp32
        displayName: Export and upload Xtensa ESP32 image
        gccVersion: '10.3'
        commands:
          - |
            set -eu
            cd "$WORKSPACE"
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends skopeo python3 curl
            python3 - <<'PY'
            import base64
            import json
            import os
            from pathlib import Path
            import subprocess
            import tempfile
            from urllib.error import HTTPError
            from urllib.parse import quote, urlencode
            from urllib.request import Request, urlopen

            def required(name):
                value = os.environ.get(name, "").strip()
                if not value:
                    raise ValueError(f"Missing pipeline parameter: {name}")
                return value

            token = required("RELEASE_TOKEN")
            repository = required("RELEASE_REPOSITORY").split("/")
            if len(repository) != 2 or not all(repository):
                raise ValueError("RELEASE_REPOSITORY must be owner/repo")
            base = "https://gitee.com/api/v5/repos/" + "/".join(
                quote(part, safe="") for part in repository)

            def api(path, data=None, method=None):
                url = base + path
                if data is None:
                    url += "?" + urlencode({"access_token": token})
                    payload = None
                else:
                    payload = json.dumps(dict(data, access_token=token)).encode()
                request = Request(url, data=payload, method=method,
                                  headers={"Content-Type": "application/json"})
                try:
                    with urlopen(request, timeout=120) as response:
                        return json.load(response)
                except HTTPError as error:
                    raise RuntimeError(f"Gitee API failed with HTTP {error.code}") from None

            variant = "xtensa-esp32"
            version = required("RESOLVED_VERSION")
            image = f"zephyr-sdk-{variant}"
            tag = f"{version}-{variant}"
            local_image = f"{image}:{version}"
            host = required("REGISTRY_HOST")
            remote_image = f"{host}/{required('IMAGE_NAMESPACE')}/{local_image}"
            commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
            with tempfile.TemporaryDirectory(prefix="gitee-release-") as work:
                directory = Path(work)
                authfile = directory / "auth.json"
                auth = base64.b64encode(
                    f"{required('REGISTRY_USERNAME')}:{required('REGISTRY_PASSWORD')}".encode()
                ).decode()
                authfile.write_text(json.dumps({"auths": {host: {"auth": auth}}}))
                authfile.chmod(0o600)
                archive = directory / "image.tar"
                subprocess.run([
                    "skopeo", "copy", "--src-authfile", str(authfile),
                    "--override-os", "linux", "--override-arch", "amd64",
                    f"docker://{remote_image}", f"docker-archive:{archive}:{local_image}",
                ], check=True)
                # pipefail prevents publishing truncated archives if gzip fails.
                prefix = str(directory / f"{image}.tar.gz.part")
                subprocess.run([
                    "bash", "-o", "pipefail", "-c",
                    'gzip -c "$1" | split -b 95M -d -a 4 --numeric-suffixes=1 - "$2"',
                    "export", str(archive), prefix,
                ], check=True)
                archive.unlink()
                parts = sorted(directory.glob(f"{image}.tar.gz.part*"))
                if not parts or any(path.stat().st_size == 0 for path in parts):
                    raise ValueError("Exported image archive is empty")
                checksums = directory / "SHA256SUMS"
                with checksums.open("wb") as output:
                    subprocess.run(["sha256sum"] + [path.name for path in parts],
                                   cwd=directory, stdout=output, check=True)
                files = parts + [checksums]
                print(f"Uploading {sum(path.stat().st_size for path in files)} bytes; "
                      "ensure sufficient Gitee attachment quota.", flush=True)
                release_data = {
                    "tag_name": tag,
                    "name": f"Zephyr SDK Docker Image {version} ({variant})",
                    "body": f"Download all `{image}.tar.gz.part*` files and `SHA256SUMS`.\n\n"
                            f"```bash\nsha256sum -c SHA256SUMS\n"
                            f"cat {image}.tar.gz.part* | docker load\n```\n",
                    "target_commitish": commit,
                    "prerelease": True,
                }
                release = api("/releases", release_data)
                tokenfile = directory / "token"
                tokenfile.write_text(token)
                tokenfile.chmod(0o600)
                for path in files:
                    subprocess.run([
                        "curl", "--fail", "--silent", "--show-error",
                        "--connect-timeout", "30", "--max-time", "1800",
                        "--output", str(directory / "upload-response.json"),
                        "--form", f"access_token=<{tokenfile}",
                        "--form", f"file=@{path}",
                        f"{base}/releases/{release['id']}/attach_files",
                    ], check=True)
                release_data.pop("target_commitish")
                release_data["prerelease"] = False
                api(f"/releases/{release['id']}", release_data, method="PATCH")
                print(f"Published {tag}")
            PY

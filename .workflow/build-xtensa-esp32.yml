version: '1.0'
name: zephyr-build-xtensa-esp32
displayName: Zephyr Docker Build (Xtensa ESP32)
triggers:
  trigger: manual
strategy:
  blocking: true
stages:
  - name: build
    displayName: Build and publish
    trigger: auto
    steps:
      - step: build@gcc
        name: build_xtensa_esp32
        displayName: Build Xtensa ESP32 image and publish Gitee Release
        gccVersion: '10.3'
        commands:
          - |
            # The plugin runs with xtrace; disable it so secrets never reach the log.
            set +x
            set -eu
            cd "$WORKSPACE"
            variant=xtensa-esp32
            image="zephyr-sdk-$variant"

            require() {
                eval "value=\${$1:-}"
                if [ -z "$value" ]; then
                    echo "Missing pipeline parameter: $1" >&2
                    exit 1
                fi
                printf '%s' "$value"
            }

            RELEASE_TOKEN=$(require RELEASE_TOKEN)
            RELEASE_REPOSITORY=$(require RELEASE_REPOSITORY)
            export RELEASE_TOKEN RELEASE_REPOSITORY

            if command -v sudo >/dev/null 2>&1; then
                SUDO=sudo
            else
                SUDO=
            fi

            version="${ZEPHYR_VERSION:-}"
            if [ -z "$version" ]; then
                version=$(curl -fsS --max-time 60 \
                    https://api.github.com/repos/zephyrproject-rtos/zephyr/releases/latest \
                    | sed -n 's/.*"tag_name"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -1)
            fi
            if ! printf '%s' "$version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9.-]+)?$'; then
                echo "ZEPHYR_VERSION must be a version tag, e.g. v4.4.2" >&2
                exit 1
            fi
            tag="$version-$variant"

            # Check before the expensive build, not after.
            if curl -fsS --max-time 30 -o /dev/null --get \
                --data-urlencode "access_token=$RELEASE_TOKEN" \
                "https://gitee.com/api/v5/repos/$RELEASE_REPOSITORY/releases/tags/$tag"; then
                echo "Release $tag already exists; skipping."
                exit 0
            fi

            echo "Building Zephyr $version ($variant)"
            $SUDO apt-get update -qq
            $SUDO apt-get install -y --no-install-recommends buildah curl >/dev/null

            work=$(mktemp -d)
            trap 'rm -rf "$work"' EXIT

            secret_arg=
            if [ -n "${GITHUB_TOKEN:-}" ]; then
                printf '%s' "$GITHUB_TOKEN" > "$work/gh_token"
                chmod 600 "$work/gh_token"
                secret_arg="--secret id=gh_token,src=$work/gh_token"
            fi

            build_args="--build-arg ZEPHYR_VERSION=$version"
            if [ -n "${BASE_IMAGE:-}" ]; then
                build_args="$build_args --build-arg BASE_IMAGE=$BASE_IMAGE"
            fi
            if [ -n "${APT_MIRROR:-}" ]; then
                build_args="$build_args --build-arg APT_MIRROR=$APT_MIRROR"
            fi

            # No Docker daemon in Gitee cloud: buildah builds and exports directly.
            $SUDO buildah --storage-driver=vfs bud --isolation chroot $secret_arg $build_args \
                -f "Dockerfile.$variant" -t "$image:$version" .

            $SUDO buildah --storage-driver=vfs push "$image:$version" \
                "docker-archive:$work/image.tar:$image:$version"
            $SUDO buildah --storage-driver=vfs rmi "$image:$version" >/dev/null 2>&1 || true

            if [ -n "$SUDO" ]; then
                $SUDO chown -R "$(id -u):$(id -g)" "$work"
            fi

            # pipefail prevents publishing a truncated archive when gzip fails.
            bash -o pipefail -c \
                'gzip -c "$1" | split -b 95M -d -a 4 --numeric-suffixes=1 - "$2/image.tar.gz.part"' \
                export "$work/image.tar"
            rm -f "$work/image.tar"
            ( cd "$work" && sha256sum image.tar.gz.part* > SHA256SUMS )
            ls -lh "$work"

            RELEASE_WORK="$work" VARIANT="$variant" VERSION="$version" python3 - <<'PY'
            import json
            import os
            import shutil
            import subprocess
            from pathlib import Path
            from urllib.error import HTTPError
            from urllib.parse import quote, urlencode
            from urllib.request import Request, urlopen

            token = os.environ["RELEASE_TOKEN"]
            repository = os.environ["RELEASE_REPOSITORY"].strip().split("/")
            if len(repository) != 2 or not all(repository):
                raise SystemExit("RELEASE_REPOSITORY must be owner/repo")
            base = "https://gitee.com/api/v5/repos/" + "/".join(
                quote(part, safe="") for part in repository)
            variant = os.environ["VARIANT"]
            version = os.environ["VERSION"]
            image = f"zephyr-sdk-{variant}"
            tag = f"{version}-{variant}"
            directory = Path(os.environ["RELEASE_WORK"])


            def api(path, data=None, method=None):
                url = base + path
                payload = None
                if data is None:
                    url += "?" + urlencode({"access_token": token})
                else:
                    payload = json.dumps(dict(data, access_token=token)).encode()
                request = Request(url, data=payload, method=method,
                                  headers={"Content-Type": "application/json"})
                try:
                    with urlopen(request, timeout=120) as response:
                        return json.load(response)
                except HTTPError as error:
                    # Never include the request URL: it carries the access token.
                    raise RuntimeError(f"Gitee API failed with HTTP {error.code}") from None


            try:
                api("/releases/tags/" + quote(tag, safe=""))
            except RuntimeError as error:
                if "HTTP 404" not in str(error):
                    raise
            else:
                print(f"Release {tag} already exists; nothing to upload.")
                shutil.rmtree(directory, ignore_errors=True)
                raise SystemExit(0)

            files = sorted(directory.glob(f"{image}.tar.gz.part*"))
            if not files or any(path.stat().st_size == 0 for path in files):
                raise SystemExit("Exported image archive is empty")
            files.append(directory / "SHA256SUMS")

            body = (f"Download all `{image}.tar.gz.part*` files and `SHA256SUMS`.\n\n"
                    f"```bash\nsha256sum -c SHA256SUMS\n"
                    f"cat {image}.tar.gz.part* | docker load\n```\n")
            release_data = {
                "tag_name": tag,
                "name": f"Zephyr SDK Docker Image {version} ({variant})",
                "body": body,
                "target_commitish": subprocess.check_output(
                    ["git", "rev-parse", "HEAD"], text=True).strip(),
                "prerelease": True,
            }
            release = api("/releases", release_data)

            tokenfile = directory / "token"
            tokenfile.write_text(token)
            tokenfile.chmod(0o600)
            for path in files:
                subprocess.run([
                    "curl", "--fail", "--silent", "--show-error",
                    "--connect-timeout", "30", "--max-time", "1800",
                    "--output", str(directory / "upload-response.json"),
                    "--form", f"access_token=<{tokenfile}",
                    "--form", f"file=@{path}",
                    f"{base}/releases/{release['id']}/attach_files",
                ], check=True)

            release_data.pop("target_commitish")
            release_data["prerelease"] = False
            api(f"/releases/{release['id']}", release_data, method="PATCH")
            shutil.rmtree(directory, ignore_errors=True)
            print(f"Published {tag}")
            PY

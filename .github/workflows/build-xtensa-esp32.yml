name: Zephyr Docker Build (Xtensa ESP32)

on:
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Get latest Zephyr version
        id: zephyr
        run: |
          ZEPHYR_VERSION=$(curl -sf -H "Authorization: ****** secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/zephyrproject-rtos/zephyr/releases/latest \
            | grep '"tag_name"' | head -1 | sed 's/.*"tag_name": *"\(.*\)".*/\1/')
          if [ -z "$ZEPHYR_VERSION" ]; then
            echo "Failed to resolve latest Zephyr version" >&2
            exit 1
          fi
          echo "version=${ZEPHYR_VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${ZEPHYR_VERSION}-xtensa-esp32" >> $GITHUB_OUTPUT
          echo "Latest Zephyr version: ${ZEPHYR_VERSION}"

      - name: Check if already built
        id: check
        run: |
          HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" \
            -H "Authorization: ****** secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ steps.zephyr.outputs.tag }}" \
            || echo "404")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Release ${{ steps.zephyr.outputs.tag }} already exists, skipping build."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "New version ${{ steps.zephyr.outputs.tag }} detected, starting build."
          fi

      - name: Free disk space
        if: steps.check.outputs.skip == 'false'
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/.ghcup
          sudo docker image prune -af
          df -h

      - name: Set up Docker Buildx
        if: steps.check.outputs.skip == 'false'
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN_SECRET: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker build \
            --secret id=gh_token,env=GH_TOKEN_SECRET \
            -f Dockerfile.xtensa-esp32 \
            --build-arg ZEPHYR_VERSION=${{ steps.zephyr.outputs.version }} \
            -t zephyr-sdk-xtensa-esp32:${{ steps.zephyr.outputs.version }} .

      - name: Export and split image
        if: steps.check.outputs.skip == 'false'
        run: |
          mkdir -p ./release-parts
          docker save zephyr-sdk-xtensa-esp32:${{ steps.zephyr.outputs.version }} \
            | gzip \
            | split -b 1024m --numeric-suffixes=1 --suffix-length=1 - ./release-parts/zephyr-sdk-xtensa-esp32.tar.gz.part
          ls -lh ./release-parts/

      - name: Create GitHub Release and upload artifact
        if: steps.check.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.zephyr.outputs.tag }}
          name: "Zephyr SDK Docker Image ${{ steps.zephyr.outputs.version }} (Xtensa ESP32)"
          body: |
            ## Zephyr Docker Image — ${{ steps.zephyr.outputs.version }} (Xtensa ESP32, `xtensa-espressif_esp32_zephyr-elf` toolchain)

            > Download all `zephyr-sdk-xtensa-esp32.tar.gz.part*` files into the same directory, then merge them into a single archive before importing into Docker.

            Linux / macOS:
            cat zephyr-sdk-xtensa-esp32.tar.gz.part* > zephyr-sdk-xtensa-esp32.tar.gz

            Windows (PowerShell):
            Get-Content zephyr-sdk-xtensa-esp32.tar.gz.part* -AsByteStream | Set-Content zephyr-sdk-xtensa-esp32.tar.gz -AsByteStream
          files: ./release-parts/zephyr-sdk-xtensa-esp32.tar.gz.part*
          make_latest: false

name: Zephyr Docker Build

on:
  schedule:
    - cron: '0 2 1 * *'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate version tag
        id: version
        run: |
          VERSION=$(date +'%Y.%m')
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          echo "image_name=zephyr-sdk-${VERSION}" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build -t zephyr-sdk:${{ steps.version.outputs.tag }} .

      - name: Export and split image
        run: |
          mkdir -p ./release-parts
          docker save zephyr-sdk:${{ steps.version.outputs.tag }} \
            | gzip \
            | split -b 1024m - ./release-parts/zephyr-sdk.tar.gz.part_
          ls -lh ./release-parts/

      - name: Create GitHub Release and upload artifact
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Zephyr SDK Docker Image ${{ steps.version.outputs.tag }}"
          body: |
            ## Zephyr Docker Image — ${{ steps.version.outputs.tag }}

            > Download all `zephyr-sdk.tar.gz.part_*` files into the same directory, then merge them into a single archive before importing into Docker.

            Linux / macOS:
            cat zephyr-sdk.tar.gz.part_* > zephyr-sdk.tar.gz

            Windows (PowerShell):
            Get-Content zephyr-sdk.tar.gz.part_* -AsByteStream | Set-Content zephyr-sdk.tar.gz -AsByteStream
          files: ./release-parts/zephyr-sdk.tar.gz.part_*
          make_latest: true